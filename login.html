<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Mafilika Business Automation Suite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="mafilika-brand text-decoration-none fs-4">Mafilika<span> Suite</span></a>
        <h2 class="mt-3 mb-1">Welcome Back</h2>
        <p class="text-muted mb-0">Sign in to your dashboard.</p>
      </div>

      <div id="loginFeedback" class="form-feedback" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" required placeholder="you@company.com">
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required placeholder="Your password">
        </div>

        <button type="submit" id="loginButton" class="btn btn-mafilika w-100 d-flex align-items-center justify-content-center">
          <span class="spinner-border mafilika-spinner" id="loginSpinner" role="status" aria-hidden="true"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        Don't have an account?
        <a href="register.html" class="auth-switch-link">Create one</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
