<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Mafilika Business Automation Suite</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-4">
        <a href="index.html" class="mafilika-brand text-decoration-none fs-4">Mafilika<span> Suite</span></a>
        <h2 class="mt-3 mb-1">Create Your Account</h2>
        <p class="text-muted mb-0">Start automating your business today.</p>
      </div>

      <div id="registerFeedback" class="form-feedback" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="fullName" required minlength="2" placeholder="e.g. Thabo Nkosi">
        </div>

        <div class="mb-3">
          <label for="companyName" class="form-label">Company Name</label>
          <input type="text" class="form-control" id="companyName" required minlength="2" placeholder="e.g. Mafilika Holdings">
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" required placeholder="you@company.com">
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required minlength="8" placeholder="At least 8 characters">
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" required minlength="8" placeholder="Re-enter your password">
        </div>

        <button type="submit" id="registerButton" class="btn btn-mafilika w-100 d-flex align-items-center justify-content-center">
          <span class="spinner-border mafilika-spinner" id="registerSpinner" role="status" aria-hidden="true"></span>
          <span class="btn-text">Create Account</span>
        </button>
      </form>

      <p class="text-center mt-4 mb-0">
        Already have an account?
        <a href="login.html" class="auth-switch-link">Sign in</a>
      </p>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
